<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Claude Chat</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            font-size: 16px;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            margin-top: 8px;
            padding: 10px 24px;
            font-size: 16px;
            cursor: pointer;
        }

        #response {
            margin-top: 24px;
            padding: 16px;
            background: #f5f5f5;
            border-radius: 8px;
            white-space: pre-wrap;
            min-height: 60px;
        }
    </style>
</head>

<body>
    <h1>Claude Chat!</h1>
    <textarea id="prompt" placeholder="質問を入力してください"></textarea>
    <br>
    <button onclick="sendMessage()">送信</button>
    <div id="response">ここに回答が表示されます</div>
    <div id="tools-used" style="margin-top: 12px; font-size: 13px; color: #888;"></div>
    <div id="conversation"
        style="margin-top: 16px; padding: 16px; background: #fafafa; border: 1px solid #ddd; border-radius: 8px; font-size: 14px;">
    </div>

    <script>
        async function sendMessage() {
            const prompt = document.getElementById("prompt").value;
            const responseDiv = document.getElementById("response");

            responseDiv.textContent = "考え中...";

            const res = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: prompt }),
            });
            const data = await res.json();
            responseDiv.textContent = data.response;
            const toolsDiv = document.getElementById("tools-used");
            if (data.tools_used.length > 0) {
                toolsDiv.textContent = "使用ツール・ローカルMCP：" + data.tools_used.join(", ");
            } else {
                toolsDiv.textContent = "ツールは利用していないです";
            }

            const convDiv = document.getElementById("conversation");
            convDiv.innerHTML = "";
            for (const msg of data.raw_messages) {
                const section = document.createElement("div");
                section.style.marginBottom = "10px";

                const label = document.createElement("div");
                label.style.fontSize = "11px";
                label.style.fontWeight = "bold";
                label.style.marginBottom = "2px";
                if (msg.role === "user") label.style.color = "#1a56db";
                else label.style.color = "#111";
                label.textContent = `[${msg.role}]`;

                const pre = document.createElement("pre");
                pre.style.margin = "0";
                pre.style.padding = "8px";
                pre.style.background = "#1e1e1e";
                pre.style.color = "#d4d4d4";
                pre.style.borderRadius = "4px";
                pre.style.fontSize = "12px";
                pre.style.whiteSpace = "pre-wrap";
                pre.textContent = JSON.stringify(msg.content, null, 2);

                section.appendChild(label);
                section.appendChild(pre);
                convDiv.appendChild(section);
            }


        }
    </script>
</body>

</html>
